<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" role="img" aria-labelledby="title desc">
  <title id="title">付款节奏与财务处理流程图</title>
  <desc id="desc">Payment 1, Payment 2, Payment 3 各自提交后，都进入 Finance Approve 和 Post，再进入下一业务阶段。</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L16,8 L1,15 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-soft" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L16,8 L1,15 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f6f7f9; }
      .title { font: 700 34px Arial, "Microsoft YaHei", sans-serif; fill: #1c2430; }
      .subtitle { font: 400 18px Arial, "Microsoft YaHei", sans-serif; fill: #667085; }
      .lane { fill: #ffffff; stroke: #d7dde7; stroke-width: 1.4; }
      .lane-title { font: 700 18px Arial, "Microsoft YaHei", sans-serif; fill: #1c2430; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .node-blue { fill: #eef5ff; stroke: #bfdbfe; stroke-width: 1.5; filter: url(#shadow); }
      .node-green { fill: #edf8f0; stroke: #bbf7d0; stroke-width: 1.5; filter: url(#shadow); }
      .node-amber { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; filter: url(#shadow); }
      .node-purple { fill: #f7f3ff; stroke: #c4b5fd; stroke-width: 1.5; filter: url(#shadow); }
      .label { font: 700 20px Arial, "Microsoft YaHei", sans-serif; fill: #1c2430; }
      .small { font: 400 15px Arial, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .formula { font: 700 14px Arial, "Microsoft YaHei", sans-serif; fill: #1d6f5f; }
      .arrow { fill: none; stroke: #1d4ed8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#arrow-soft); }
      .arrow-label { font: 700 14px Arial, "Microsoft YaHei", sans-serif; fill: #1d4ed8; }
      .note { fill: #ffffff; stroke: #d7dde7; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="bg" width="1700" height="1040"/>
  <text class="title" x="70" y="70">付款节奏与财务处理流程图</text>
  <text class="subtitle" x="70" y="105">Payment 1 / 2 / 3 每一笔付款申请后，都单独走 Finance Approve -> Post -> Paid。</text>

  <rect class="lane" x="70" y="155" width="1560" height="220" rx="8"/>
  <rect class="lane" x="70" y="410" width="1560" height="220" rx="8"/>
  <rect class="lane" x="70" y="665" width="1560" height="220" rx="8"/>

  <text class="lane-title" x="110" y="190">Payment 1</text>
  <text class="lane-title" x="110" y="445">Payment 2</text>
  <text class="lane-title" x="110" y="700">Payment 3</text>

  <g transform="translate(210 215)">
    <rect class="node-blue" width="240" height="100" rx="8"/>
    <text class="label" x="120" y="34" text-anchor="middle">Application Form</text>
    <text class="small" x="120" y="62" text-anchor="middle">派工单触发首款</text>
    <text class="formula" x="120" y="84" text-anchor="middle">16,800 x 50% = 8,400</text>
  </g>
  <g transform="translate(530 215)">
    <rect class="node" width="220" height="100" rx="8"/>
    <text class="label" x="110" y="34" text-anchor="middle">Payment Request</text>
    <text class="small" x="110" y="64" text-anchor="middle">提交 P1 付款申请</text>
  </g>
  <g transform="translate(830 215)">
    <rect class="node-purple" width="220" height="100" rx="8"/>
    <text class="label" x="110" y="34" text-anchor="middle">Finance Approve</text>
    <text class="small" x="110" y="64" text-anchor="middle">财务审核首款</text>
  </g>
  <g transform="translate(1130 215)">
    <rect class="node-green" width="180" height="100" rx="8"/>
    <text class="label" x="90" y="38" text-anchor="middle">Post</text>
    <text class="small" x="90" y="68" text-anchor="middle">P1 过账</text>
  </g>
  <g transform="translate(1390 215)">
    <rect class="node-green" width="180" height="100" rx="8"/>
    <text class="label" x="90" y="38" text-anchor="middle">Paid</text>
    <text class="small" x="90" y="68" text-anchor="middle">进入验收阶段</text>
  </g>

  <g transform="translate(210 470)">
    <rect class="node-amber" width="240" height="100" rx="8"/>
    <text class="label" x="120" y="34" text-anchor="middle">Acceptance Form</text>
    <text class="small" x="120" y="62" text-anchor="middle">验收单触发第二笔</text>
    <text class="formula" x="120" y="84" text-anchor="middle">16,900 x 90% - P1 = 6,810</text>
  </g>
  <g transform="translate(530 470)">
    <rect class="node" width="220" height="100" rx="8"/>
    <text class="label" x="110" y="34" text-anchor="middle">Payment Request</text>
    <text class="small" x="110" y="64" text-anchor="middle">提交 P2 付款申请</text>
  </g>
  <g transform="translate(830 470)">
    <rect class="node-purple" width="220" height="100" rx="8"/>
    <text class="label" x="110" y="34" text-anchor="middle">Finance Approve</text>
    <text class="small" x="110" y="64" text-anchor="middle">财务审核第二笔</text>
  </g>
  <g transform="translate(1130 470)">
    <rect class="node-green" width="180" height="100" rx="8"/>
    <text class="label" x="90" y="38" text-anchor="middle">Post</text>
    <text class="small" x="90" y="68" text-anchor="middle">P2 过账</text>
  </g>
  <g transform="translate(1390 470)">
    <rect class="node-green" width="180" height="100" rx="8"/>
    <text class="label" x="90" y="38" text-anchor="middle">Paid</text>
    <text class="small" x="90" y="68" text-anchor="middle">进入尾款阶段</text>
  </g>

  <g transform="translate(210 725)">
    <rect class="node-amber" width="240" height="100" rx="8"/>
    <text class="label" x="120" y="34" text-anchor="middle">Final Balance</text>
    <text class="small" x="120" y="62" text-anchor="middle">最终尾款申请</text>
    <text class="formula" x="120" y="84" text-anchor="middle">16,900 - P1 - P2 = 1,690</text>
  </g>
  <g transform="translate(530 725)">
    <rect class="node" width="220" height="100" rx="8"/>
    <text class="label" x="110" y="34" text-anchor="middle">Payment Request</text>
    <text class="small" x="110" y="64" text-anchor="middle">提交 P3 付款申请</text>
  </g>
  <g transform="translate(830 725)">
    <rect class="node-purple" width="220" height="100" rx="8"/>
    <text class="label" x="110" y="34" text-anchor="middle">Finance Approve</text>
    <text class="small" x="110" y="64" text-anchor="middle">财务审核尾款</text>
  </g>
  <g transform="translate(1130 725)">
    <rect class="node-green" width="180" height="100" rx="8"/>
    <text class="label" x="90" y="38" text-anchor="middle">Post</text>
    <text class="small" x="90" y="68" text-anchor="middle">P3 过账</text>
  </g>
  <g transform="translate(1390 725)">
    <rect class="node-green" width="180" height="100" rx="8"/>
    <text class="label" x="90" y="38" text-anchor="middle">Paid</text>
    <text class="small" x="90" y="68" text-anchor="middle">付款完成</text>
  </g>

  <path class="arrow" d="M450 265 H522"/>
  <path class="arrow" d="M750 265 H822"/>
  <path class="arrow" d="M1050 265 H1122"/>
  <path class="arrow" d="M1310 265 H1382"/>
  <path class="arrow" d="M450 520 H522"/>
  <path class="arrow" d="M750 520 H822"/>
  <path class="arrow" d="M1050 520 H1122"/>
  <path class="arrow" d="M1310 520 H1382"/>
  <path class="arrow" d="M450 775 H522"/>
  <path class="arrow" d="M750 775 H822"/>
  <path class="arrow" d="M1050 775 H1122"/>
  <path class="arrow" d="M1310 775 H1382"/>

  <path class="arrow-soft" d="M1480 315 V390 H330 V462"/>
  <path class="arrow-soft" d="M1480 570 V645 H330 V717"/>
  <g transform="translate(210 930)">
    <rect class="note" width="1260" height="62" rx="8"/>
    <text class="small" x="22" y="27">控制点：Payment 1、Payment 2、Payment 3 不是等到最后统一 Post；每一笔付款都需要单独 Finance Approve，并在审批通过后单独 Post。</text>
    <text class="small" x="22" y="49">下一阶段只能基于上一笔付款已完成或业务条件已满足后继续。</text>
  </g>
</svg>
