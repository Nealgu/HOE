<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">财务付款审批与 Post 独立流程图</title>
  <desc id="desc">单独展示每一笔 Payment Request 在 Finance 中的审批、退回、过账和付款完成流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L16,8 L1,15 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-soft" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L16,8 L1,15 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f6f7f9; }
      .title { font: 700 34px Arial, "Microsoft YaHei", sans-serif; fill: #1c2430; }
      .subtitle { font: 400 18px Arial, "Microsoft YaHei", sans-serif; fill: #667085; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .node-blue { fill: #eef5ff; stroke: #bfdbfe; stroke-width: 1.5; filter: url(#shadow); }
      .node-green { fill: #edf8f0; stroke: #bbf7d0; stroke-width: 1.5; filter: url(#shadow); }
      .node-purple { fill: #f7f3ff; stroke: #c4b5fd; stroke-width: 1.5; filter: url(#shadow); }
      .node-red { fill: #fff1f3; stroke: #fecdd3; stroke-width: 1.5; filter: url(#shadow); }
      .decision { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; filter: url(#shadow); }
      .label { font: 700 20px Arial, "Microsoft YaHei", sans-serif; fill: #1c2430; }
      .small { font: 400 15px Arial, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .tiny { font: 400 13px Arial, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #1d4ed8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#arrow-soft); }
      .arrow-label { font: 700 14px Arial, "Microsoft YaHei", sans-serif; fill: #1d4ed8; }
      .arrow-label-soft { font: 700 14px Arial, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .rail { stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1700" height="900"/>
  <text class="title" x="70" y="70">财务付款审批与 Post 独立流程图</text>
  <text class="subtitle" x="70" y="105">此流程适用于 Payment 1、Payment 2、Payment 3，每一笔付款都独立审批、独立过账。</text>

  <g transform="translate(90 185)">
    <rect class="node-blue" width="250" height="110" rx="8"/>
    <text class="label" x="125" y="38" text-anchor="middle">Payment Request</text>
    <text class="small" x="125" y="68" text-anchor="middle">P1 / P2 / P3</text>
    <text class="tiny" x="125" y="92" text-anchor="middle">由业务节点触发</text>
  </g>

  <g transform="translate(430 185)">
    <rect class="node-purple" width="260" height="110" rx="8"/>
    <text class="label" x="130" y="38" text-anchor="middle">Finance Review</text>
    <text class="small" x="130" y="68" text-anchor="middle">金额 / 单据 / 供应商</text>
    <text class="tiny" x="130" y="92" text-anchor="middle">检查付款条件是否满足</text>
  </g>

  <g transform="translate(790 165)">
    <polygon class="decision" points="130,0 260,75 130,150 0,75"/>
    <text class="label" x="130" y="64" text-anchor="middle">Approve?</text>
    <text class="small" x="130" y="94" text-anchor="middle">财务是否通过</text>
  </g>

  <g transform="translate(1160 185)">
    <rect class="node-green" width="220" height="110" rx="8"/>
    <text class="label" x="110" y="40" text-anchor="middle">Post</text>
    <text class="small" x="110" y="70" text-anchor="middle">生成财务过账</text>
  </g>

  <g transform="translate(1460 185)">
    <rect class="node-green" width="170" height="110" rx="8"/>
    <text class="label" x="85" y="40" text-anchor="middle">Paid</text>
    <text class="small" x="85" y="70" text-anchor="middle">付款完成</text>
  </g>

  <g transform="translate(780 420)">
    <rect class="node-red" width="280" height="110" rx="8"/>
    <text class="label" x="140" y="38" text-anchor="middle">Reject / Return</text>
    <text class="small" x="140" y="68" text-anchor="middle">退回业务修改</text>
    <text class="tiny" x="140" y="92" text-anchor="middle">修改后可重新提交</text>
  </g>

  <path class="arrow" d="M340 240 H422"/>
  <path class="arrow" d="M690 240 H782"/>
  <path class="arrow" d="M1050 240 H1152"/>
  <path class="arrow" d="M1380 240 H1452"/>
  <path class="arrow-soft" d="M920 315 V412"/>
  <path class="arrow-soft" d="M780 475 H540 V302"/>

  <text class="arrow-label" x="386" y="224" text-anchor="middle">Submit</text>
  <text class="arrow-label" x="736" y="224" text-anchor="middle">Review</text>
  <text class="arrow-label" x="1104" y="224" text-anchor="middle">Approve</text>
  <text class="arrow-label" x="1420" y="224" text-anchor="middle">Post</text>
  <text class="arrow-label-soft" x="945" y="370" text-anchor="middle">Reject</text>
  <text class="arrow-label-soft" x="610" y="458" text-anchor="middle">Revise</text>

  <g transform="translate(150 650)">
    <line class="rail" x1="0" y1="0" x2="1390" y2="0"/>
    <circle cx="0" cy="0" r="10" fill="#1d4ed8"/>
    <circle cx="460" cy="0" r="10" fill="#1d4ed8"/>
    <circle cx="920" cy="0" r="10" fill="#1d4ed8"/>
    <circle cx="1390" cy="0" r="10" fill="#1d4ed8"/>
    <text class="label" x="0" y="42" text-anchor="middle">P1</text>
    <text class="small" x="0" y="70" text-anchor="middle">首款</text>
    <text class="label" x="460" y="42" text-anchor="middle">P2</text>
    <text class="small" x="460" y="70" text-anchor="middle">验收后累计到 90%</text>
    <text class="label" x="920" y="42" text-anchor="middle">P3</text>
    <text class="small" x="920" y="70" text-anchor="middle">最终尾款到 100%</text>
    <text class="label" x="1390" y="42" text-anchor="middle">Closed</text>
    <text class="small" x="1390" y="70" text-anchor="middle">付款流程结束</text>
  </g>

  <g transform="translate(190 795)">
    <rect class="node" width="1240" height="60" rx="8"/>
    <text class="small" x="24" y="36">说明：业务系统中可以把 Finance Review / Post 抽象成一个可复用子流程，Payment 1、Payment 2、Payment 3 都调用同一套财务流程。</text>
  </g>
</svg>
