<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">安装分包结算主业务流程图</title>
  <desc id="desc">从客户销售合同到分包预算、派工申请、成本计算、毛利检查、付款、财务审批和过账的主流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L16,8 L1,15 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-muted" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L16,8 L1,15 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f6f7f9; }
      .title { font: 700 34px Arial, "Microsoft YaHei", sans-serif; fill: #1c2430; }
      .subtitle { font: 400 18px Arial, "Microsoft YaHei", sans-serif; fill: #667085; }
      .section { font: 700 18px Arial, "Microsoft YaHei", sans-serif; fill: #2563eb; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .node-soft { fill: #eef5ff; stroke: #bfdbfe; stroke-width: 1.5; filter: url(#shadow); }
      .node-green { fill: #edf8f0; stroke: #bbf7d0; stroke-width: 1.5; filter: url(#shadow); }
      .node-amber { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; filter: url(#shadow); }
      .node-red { fill: #fff1f3; stroke: #fecdd3; stroke-width: 1.5; filter: url(#shadow); }
      .diamond { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; filter: url(#shadow); }
      .label { font: 700 19px Arial, "Microsoft YaHei", sans-serif; fill: #1c2430; }
      .small { font: 400 15px Arial, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .tiny { font: 400 13px Arial, "Microsoft YaHei", sans-serif; fill: #64748b; }
      .arrow { fill: none; stroke: #1d4ed8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-muted { fill: none; stroke: #64748b; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#arrow-muted); }
      .arrow-label { font: 700 14px Arial, "Microsoft YaHei", sans-serif; fill: #1d4ed8; }
      .note { fill: #ffffff; stroke: #d7dde7; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1250"/>
  <text class="title" x="70" y="70">安装分包结算主业务流程图</text>
  <text class="subtitle" x="70" y="105">Customer SO -> Vendor Budget -> Application Form -> Margin Check -> Payment -> Finance Post</text>

  <text class="section" x="70" y="160">1. 收入与预算</text>
  <text class="section" x="70" y="430">2. 成本计算</text>
  <text class="section" x="70" y="720">3. 验收与付款</text>
  <text class="section" x="70" y="1040">4. 财务与售后</text>

  <g transform="translate(70 185)">
    <rect class="node-soft" width="230" height="100" rx="8"/>
    <text class="label" x="115" y="38" text-anchor="middle">Customer / 客户</text>
    <text class="small" x="115" y="66" text-anchor="middle">销售合同与客户信息</text>
  </g>

  <g transform="translate(360 185)">
    <rect class="node-soft" width="230" height="100" rx="8"/>
    <text class="label" x="115" y="34" text-anchor="middle">SO / 销售订单</text>
    <text class="small" x="115" y="62" text-anchor="middle">门型 / 数量 / 面积</text>
    <text class="tiny" x="115" y="84" text-anchor="middle">合同号与 SO 号</text>
  </g>

  <g transform="translate(650 185)">
    <rect class="node-soft" width="250" height="100" rx="8"/>
    <text class="label" x="125" y="34" text-anchor="middle">Installation Revenue</text>
    <text class="small" x="125" y="62" text-anchor="middle">安装收入，例如 80,000</text>
  </g>

  <g transform="translate(980 160)">
    <rect class="node" width="360" height="150" rx="8"/>
    <text class="label" x="180" y="35" text-anchor="middle">Vendor Budget Split</text>
    <text class="small" x="180" y="68" text-anchor="middle">Vendor A 30% = 24,000</text>
    <text class="small" x="180" y="95" text-anchor="middle">Vendor B 30% = 24,000</text>
    <text class="small" x="180" y="122" text-anchor="middle">Vendor C 40% = 32,000</text>
  </g>

  <g transform="translate(1400 150)">
    <rect class="node" x="45" y="0" width="310" height="104" rx="8"/>
    <text class="label" x="200" y="36" text-anchor="middle">Application Form</text>
    <text class="small" x="200" y="64" text-anchor="middle">派工 / 出工申请表</text>
    <text class="tiny" x="200" y="88" text-anchor="middle">生成成本副产物</text>
    <rect class="node-amber" x="85" y="120" width="270" height="116" rx="8"/>
    <text class="tiny" x="108" y="148">Cost Outputs</text>
    <text class="small" x="108" y="178">• Standard Cost / 标准安装费</text>
    <text class="small" x="108" y="206">• Extra Cost</text>
    <text class="tiny" x="126" y="228">按 Cost Type 记录</text>
  </g>

  <path class="arrow" d="M300 235 H352"/>
  <path class="arrow" d="M590 235 H642"/>
  <path class="arrow" d="M900 235 H972"/>
  <path class="arrow" d="M1340 235 H1437"/>

  <g transform="translate(1460 470)">
    <rect class="node" width="260" height="120" rx="8"/>
    <text class="label" x="130" y="34" text-anchor="middle">读取 SO 信息</text>
    <text class="small" x="130" y="64" text-anchor="middle">门型 / 数量 / 面积</text>
    <text class="tiny" x="130" y="91" text-anchor="middle">从销售订单和合同带入</text>
  </g>

  <g transform="translate(1080 470)">
    <rect class="node" width="300" height="120" rx="8"/>
    <text class="label" x="150" y="32" text-anchor="middle">Price List</text>
    <text class="small" x="150" y="60" text-anchor="middle">最低价 / 最高价 / 有效期</text>
    <text class="tiny" x="150" y="88" text-anchor="middle">整门计价或面积 x 单价</text>
  </g>

  <g transform="translate(780 460)">
    <polygon class="diamond" points="115,0 230,70 115,140 0,70"/>
    <text class="label" x="115" y="60" text-anchor="middle">价格判断</text>
    <text class="small" x="115" y="88" text-anchor="middle">Min / Actual / Max</text>
  </g>

  <g transform="translate(1500 725)">
    <rect class="node-red" width="260" height="100" rx="8"/>
    <text class="label" x="130" y="34" text-anchor="middle">Special Request / SP</text>
    <text class="small" x="130" y="62" text-anchor="middle">线下邮件审批</text>
    <text class="tiny" x="130" y="84" text-anchor="middle">不参与 Margin Check</text>
  </g>

  <path class="arrow-muted" d="M1620 386 V430 H1590 V462"/>
  <path class="arrow" d="M1460 530 H1388"/>
  <path class="arrow" d="M1080 530 H1018"/>
  <path class="arrow" d="M780 530 H718"/>
  <path class="arrow-muted" d="M1485 328 H570 V440"/>

  <g transform="translate(430 448)">
    <polygon class="diamond" points="140,0 280,82 140,164 0,82"/>
    <text class="label" x="140" y="70" text-anchor="middle">Margin Check</text>
    <text class="small" x="140" y="98" text-anchor="middle">是否满足 30%</text>
  </g>

  <g transform="translate(760 790)">
    <rect class="node-red" width="240" height="104" rx="8"/>
    <text class="label" x="120" y="38" text-anchor="middle">Hold / 调整</text>
    <text class="small" x="120" y="68" text-anchor="middle">超预算或毛利不足</text>
  </g>

  <g transform="translate(430 790)">
    <rect class="node-green" width="250" height="104" rx="8"/>
    <text class="label" x="125" y="38" text-anchor="middle">进入付款流程</text>
    <text class="small" x="125" y="68" text-anchor="middle">生成付款申请</text>
  </g>

  <path class="arrow" d="M710 530 H740 V842 H752"/>
  <path class="arrow" d="M570 612 V782"/>
  <text class="arrow-label" x="760" y="828" text-anchor="middle">Hold</text>
  <text class="arrow-label" x="590" y="720" text-anchor="middle">Pass</text>

  <g transform="translate(190 960)">
    <rect class="node" width="250" height="100" rx="8"/>
    <text class="label" x="125" y="36" text-anchor="middle">Payment 1</text>
    <text class="small" x="125" y="66" text-anchor="middle">50% / 66.6% / 70%</text>
  </g>

  <g transform="translate(510 960)">
    <rect class="node" width="250" height="100" rx="8"/>
    <text class="label" x="125" y="36" text-anchor="middle">Acceptance Form</text>
    <text class="small" x="125" y="66" text-anchor="middle">验收单</text>
  </g>

  <g transform="translate(830 930)">
    <polygon class="diamond" points="115,0 230,70 115,140 0,70"/>
    <text class="label" x="115" y="58" text-anchor="middle">数量校验</text>
    <text class="small" x="115" y="88" text-anchor="middle">派工 = 验收</text>
  </g>

  <g transform="translate(1150 960)">
    <rect class="node" width="250" height="100" rx="8"/>
    <text class="label" x="125" y="36" text-anchor="middle">Payment 2</text>
    <text class="small" x="125" y="66" text-anchor="middle">累计到 90% 后财务处理</text>
  </g>

  <g transform="translate(1460 960)">
    <rect class="node" width="250" height="100" rx="8"/>
    <text class="label" x="125" y="36" text-anchor="middle">Payment 3</text>
    <text class="small" x="125" y="66" text-anchor="middle">尾款到 100% 后财务处理</text>
  </g>

  <path class="arrow-muted" d="M555 894 V925 H315 V952"/>
  <path class="arrow" d="M440 1010 H502"/>
  <path class="arrow" d="M760 1010 H826"/>
  <path class="arrow" d="M1060 1000 H1142"/>
  <path class="arrow" d="M1400 1010 H1452"/>
  <text class="arrow-label" x="1102" y="986" text-anchor="middle">Match</text>

  <g transform="translate(550 1120)">
    <rect class="node" width="250" height="88" rx="8"/>
    <text class="label" x="125" y="34" text-anchor="middle">Finance Flow</text>
    <text class="small" x="125" y="62" text-anchor="middle">每笔 Payment 审批</text>
  </g>

  <g transform="translate(890 1120)">
    <rect class="node-green" width="220" height="88" rx="8"/>
    <text class="label" x="110" y="34" text-anchor="middle">Post per Payment</text>
    <text class="small" x="110" y="62" text-anchor="middle">P1/P2/P3 各自过账</text>
  </g>

  <g transform="translate(1200 1120)">
    <rect class="node" width="300" height="88" rx="8"/>
    <text class="label" x="150" y="34" text-anchor="middle">Warranty / After Service</text>
    <text class="small" x="150" y="62" text-anchor="middle">CCM / 质保 / 售后</text>
  </g>

  <path class="arrow-muted" d="M1585 1060 V1090 H675 V1112"/>
  <path class="arrow" d="M800 1164 H882"/>
  <path class="arrow" d="M1110 1164 H1192"/>

  <g transform="translate(80 1120)">
    <rect class="note" width="330" height="88" rx="8"/>
    <text class="small" x="24" y="33">付款前置规则：</text>
    <text class="tiny" x="24" y="58">1. 毛利检查通过或有特殊审批</text>
    <text class="tiny" x="24" y="78">2. 派工单与验收单数量必须对应</text>
  </g>
</svg>
