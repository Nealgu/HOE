<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Install Procea Diagrams Export</title>
    <style>
      body {
        margin: 0;
        padding: 28px;
        background: #f6f7f9;
        color: #1c2430;
        font-family: Arial, "Microsoft YaHei", sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0 0 22px;
        color: #667085;
      }
      section {
        margin-bottom: 28px;
        padding: 18px;
        border: 1px solid #d7dde7;
        border-radius: 8px;
        background: #ffffff;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }
      h2 {
        margin: 0;
        font-size: 19px;
      }
      a {
        display: inline-flex;
        min-height: 34px;
        align-items: center;
        padding: 0 12px;
        border-radius: 8px;
        color: #ffffff;
        background: #1d6f5f;
        text-decoration: none;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #d7dde7;
        border-radius: 8px;
        background: #f8fafc;
      }
    </style>
  </head>
  <body>
    <h1>Install Procea 流程图导出</h1>
    <p>下面流程图都是 SVG 图片，可以直接下载，也可以插入 Word、PPT 或网页。</p>

    <section>
      <div class="heading">
        <h2>主业务流程图</h2>
        <a href="./main-business-flow.svg" download>下载 SVG</a>
      </div>
      <img src="./main-business-flow.svg" alt="主业务流程图" />
    </section>

    <section>
      <div class="heading">
        <h2>付款节奏流程图</h2>
        <a href="./payment-flow.svg" download>下载 SVG</a>
      </div>
      <img src="./payment-flow.svg" alt="付款节奏流程图" />
    </section>

    <section>
      <div class="heading">
        <h2>财务付款审批与 Post 独立流程图</h2>
        <a href="./finance-payment-post-flow.svg" download>下载 SVG</a>
      </div>
      <img src="./finance-payment-post-flow.svg" alt="财务付款审批与 Post 独立流程图" />
    </section>

    <section>
      <div class="heading">
        <h2>泳道图</h2>
        <a href="./swimlane-flow.svg" download>下载 SVG</a>
      </div>
      <img src="./swimlane-flow.svg" alt="泳道图" />
    </section>
  </body>
</html>
